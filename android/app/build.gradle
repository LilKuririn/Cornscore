plugins {
    id 'com.android.application'
}

/* Les fichiers web vivent à la racine du dépôt et ne sont pas dupliqués :
   ils sont copiés dans les assets au moment de la compilation. */
def webRoot = rootProject.projectDir.parentFile
def webOut  = layout.buildDirectory.dir("webassets").get().asFile

/* Les fichiers sont listés un par un : déclarer la racine du dépôt comme
   arborescence d'entrée la ferait chevaucher le dossier de build. */
def webFiles = files(
    "${webRoot}/index.html",
    "${webRoot}/manifest.webmanifest",
    "${webRoot}/icon-192.png",
    "${webRoot}/icon-512.png",
    "${webRoot}/icon-maskable-512.png",
    "${webRoot}/apple-touch-icon.png"
)

def copyWeb = tasks.register('copyWeb', Copy) {
    from webFiles
    into webOut
}

/* Clé de signature stable, créée par la CI au premier passage.
   Sans elle, chaque build serait signé différemment et refuserait
   de s'installer par-dessus le précédent. */
def keystore = file("${rootProject.projectDir}/debug.keystore")

/* Calculé hors de la closure : « versionCode (x).toString() » serait lu par
   Groovy comme un appel dont on transforme le résultat, et non l'inverse. */
def buildCode = ((project.findProperty("vc") ?: "1") as String).toInteger()
def buildName = (project.findProperty("vn") ?: "1.0") as String

/* Clé d'envoi vers Play : fournie par la CI, jamais dans le dépôt.
   Absente, la variante release se construit sans signature — utile pour
   vérifier qu'elle compile, inutilisable pour publier. */
def uploadStore = System.getenv("RELEASE_KEYSTORE")

android {
    namespace 'com.scoretosslabs.cornscore'
    compileSdk 35

    defaultConfig {
        applicationId "com.scoretosslabs.cornscore"
        minSdk 24
        targetSdk 35
        versionCode buildCode
        versionName buildName
    }

    signingConfigs {
        debug {
            if (keystore.exists()) {
                storeFile keystore
                storePassword 'cornscore'
                keyAlias 'cornscore'
                keyPassword 'cornscore'
            }
        }
        release {
            if (uploadStore) {
                storeFile file(uploadStore)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        /* L'APK d'installation directe porte un identifiant distinct : signé
           par une autre clé que la version du magasin, il ne pourrait pas
           s'installer par-dessus. Avec ce suffixe les deux coexistent, et on
           n'a jamais à désinstaller pour passer de l'une à l'autre. */
        debug {
            applicationIdSuffix ".direct"
            resValue "string", "app_name", "Cornscore direct"
            signingConfig signingConfigs.debug
        }
        release {
            resValue "string", "app_name", "Cornscore"
            minifyEnabled false
            if (uploadStore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += webOut
        }
    }
}

dependencies {
    /* AndroidX tire deux générations de la bibliothèque standard Kotlin,
       dont les classes se recouvrent : la nomenclature les aligne. */
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}

tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn copyWeb }
