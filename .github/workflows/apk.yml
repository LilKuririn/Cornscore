name: APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon-*.png'
      - 'apple-touch-icon.png'
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clé de signature
        run: |
          if [ ! -f android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/debug.keystore \
              -storepass cornscore -keypass cornscore -alias cornscore \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Cornscore, OU=Sideload, O=Cornscore, C=FR"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f android/debug.keystore
            git commit -m "Ajouter la clé de signature de l'APK [skip ci]"
            git push
          fi

      - name: Plateforme Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Construire
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace \
            -Pvc=${{ github.run_number }} \
            -Pvn=1.0.${{ github.run_number }}

      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cornscore.apk

      - name: Déposer dans les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: cornscore-apk
          path: cornscore.apk

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk > /dev/null 2>&1 || gh release create apk \
            --title "Cornscore — APK" \
            --notes "Dernier APK installable, reconstruit à chaque modification de l'application. Fichier : cornscore.apk"
          gh release upload apk cornscore.apk --clobber
